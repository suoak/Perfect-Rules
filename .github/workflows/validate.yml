name: Validate configuration

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "43 1 * * *"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Mihomo
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1.19.31.gz \
            --output /tmp/mihomo.gz
          echo "d5e74bbddbdfff49a1aef7775bf5911da59f0d7196ed509a0ac914b3653dd5f1  /tmp/mihomo.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo

      - name: Test maintenance scripts
        env:
          MIHOMO_BIN: /tmp/mihomo
        run: node --test scripts/maintenance.test.js

      - name: Check official Voice snapshot freshness
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/update-openai-voice.js --check

      - name: Validate all configurations
        env:
          MIHOMO_BIN: /tmp/mihomo
        run: node scripts/validate-config.js

      - name: Verify anti-AD availability and size
        shell: bash
        run: |
          rules_file="$RUNNER_TEMP/anti-ad.mrs"
          if ! curl --fail --location --retry 3 --show-error --silent \
            --connect-timeout 10 --max-time 60 --max-filesize 5242880 \
            https://anti-ad.net/mihomo.mrs --output "$rules_file"; then
            echo "::warning::anti-ad.net is unavailable from this runner; checking the project's official GitHub mirror"
            curl --fail --location --retry 3 --show-error --silent \
              --connect-timeout 10 --max-time 60 --max-filesize 5242880 \
              https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/mihomo.mrs \
              --output "$rules_file"
          fi
          bytes=$(wc --bytes < "$rules_file")
          test "$bytes" -gt 0
          test "$bytes" -lt 5242880
          echo "anti-AD MRS size: $bytes bytes"
